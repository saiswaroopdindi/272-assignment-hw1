---
- name: Configure VM1 web server
  hosts: web1
  become: true
  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: true

    - name: Configure Apache to listen on port 8080
      lineinfile:
        path: /etc/apache2/ports.conf
        line: "Listen 8080"
        insertafter: "^Listen 80$"

    - name: Configure VirtualHost for port 8080
      copy:
        dest: /etc/apache2/sites-available/sjsu-8080.conf
        mode: "0644"
        content: |
          <VirtualHost *:8080>
              ServerName vm1
              DocumentRoot /var/www/html
              <Directory /var/www/html>
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>

    - name: Create VM1 webpage
      copy:
        dest: /var/www/html/index.html
        mode: "0644"
        content: |
          Hello World from SJSU-1

    - name: Enable VirtualHost
      command: a2ensite sjsu-8080.conf
      register: vm1_vhost
      changed_when: "'already enabled' not in vm1_vhost.stdout"

    - name: Restart Apache
      service:
        name: apache2
        state: restarted

